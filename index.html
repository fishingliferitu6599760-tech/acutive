<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://*.supabase.co wss://*.supabase.co; style-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f5f5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Acutive｜顧客・売上・出金管理</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="modeBanner" class="banner" hidden></div>

  <form id="login" class="login" hidden>
    <h1>Acutive</h1>
    <p class="muted">顧客・売上・出金管理</p>
    <label class="lbl" for="email">メールアドレス</label>
    <input id="email" type="email" autocomplete="username" required>
    <label class="lbl" for="password">パスワード</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr" hidden></div>
    <button class="btn big primary" id="loginBtn">ログイン</button>
    <a href="#" id="demoLink" class="small">デモ（架空データ・保存なし）を見る</a>
  </form>

  <div id="app" hidden>
    <main id="main"></main>
    <nav class="tabs">
      <a href="#/home" data-m="home">ホーム</a>
      <a href="#/sales" data-m="sale">売上</a>
      <a href="#/expenses" data-m="expense">支出</a>
      <a href="#/customers" data-m="customer">顧客</a>
      <a href="#/more" data-m="more,trips,fund,report,settings">その他</a>
    </nav>
  </div>

  <div id="print-area"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
